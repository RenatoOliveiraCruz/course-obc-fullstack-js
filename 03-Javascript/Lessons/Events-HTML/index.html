<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos no HTML</title>
  </head>
  <body>
    <h1>Eventos no HTML</h1>
    <br />
    <div>
      <label for="onMouseEnter">Entrada do mouse:</label>
      <input type="text" id="onMouseEnter" onmouseenter="onMouseEnter()" />
    </div>
    <br />
    <div>
      <label for="onChange">Mudança de valor:</label>
      <input
        type="text"
        id="onChange"
        onchange="console.log('Mudança de valor')"
      />
    </div>
    <br />
    <div>
      <label for="onFocus">Entrada de foco:</label>
      <input
        type="text"
        id="onFocus"
        onfocus="console.log('Entrada de foco')"
      />
    </div>
    <br />
    <div>
      <label for="onBlur">Saída de foco:</label>
      <input type="text" id="onBlur" onblur="console.log('Saída de foco')" />
    </div>
    <br />
    <button onclick="console.log('Botão clicado')">Clique aqui</button>

    <script src="script.js"></script>
  </body>
</html>
