<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript in HTML</title>
</head>
<body>
    <h1>Javascript in HTML</h1>

    <script>
        let name = "Renato";
        let x = 22;
        let years = "years old";

        console.log(name + ", " + x + " " + years);
        console.log(name);
        console.warn(name);
        console.error(name);
        window.alert(name);
        window.confirm(name);
        window.prompt(name);
        window.close();
        let confimation = window.confirm("Wanna confirm it?");
        console.log(confimation);
    </script>
</body>
</html>
