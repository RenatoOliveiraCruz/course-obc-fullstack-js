<!DOCTYPE html>

    <title>While</title>
</head>
<body>
    While é uma estrutura de repetição que executa um bloco de código enquanto uma condição for verdadeira. A sintaxe básica do while é a seguinte:
    <pre>
        while (condição) {
            // código a ser executado
        }  
    </pre>
</body>
